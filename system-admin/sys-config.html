<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://serbisyoburgos-ver-26.onrender.com https://sb-draft1.onrender.com https://images.unsplash.com http://localhost:4000 http://127.0.0.1:4000; connect-src 'self' https://serbisyoburgos-ver-26.onrender.com https://sb-draft1.onrender.com http://localhost:4000 http://127.0.0.1:4000; media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Configuration | SerbisyoBurgos</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#043d2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SerbisyoBurgos">
    <link rel="apple-touch-icon" href="../asset/icons/apple-touch-icon.png">
    <script src="../shared/pwa.js" defer></script>
    <link rel="icon" type="image/png" href="../asset/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-green: #16a34a;
            --brand-dark: #043d2e;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --sidebar-width: 260px;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); color: var(--text-main); display: flex; min-height: 100vh; }

        /* SIDEBAR NAVIGATION */
        aside {
            width: var(--sidebar-width);
            height: 100vh;
            background: white;
            border-right: 1px solid #e2e8f0;
            position: fixed;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: var(--brand-dark);
            font-size: 1.25rem;
        }

        .sidebar-header img {
            width: 32px;
            border-radius: 50%;
            background: white;
            padding: 3px;
            border: 3px solid var(--brand-dark);
        }
        nav { flex-grow: 1; padding: 1rem; }

        nav { flex: 1; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1rem;
            text-decoration: none;
            color: var(--text-muted);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: #f0fdf4;
            color: var(--brand-green);
        }

        .nav-item svg { width: 20px; height: 20px; }

        .sidebar-footer {
            padding: 1.5rem;
            border-top: 1px solid #f1f5f9;
            margin-top: auto;
        }

        .logout-btn {
            width: 100%;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff1f2;
            color: #e11d48;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: none;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #ffe4e6;
        }

        /* Sidebar theme */
        aside {
            background: #5f9632;
            border-right: 1px solid rgba(4, 61, 46, 0.18);
        }
        .sidebar-header {
            padding: 1.75rem 1.25rem 1.25rem;
            flex-direction: column;
            justify-content: center;
            gap: 0.75rem;
            color: white;
            font-weight: 700;
            text-align: center;
        }
        .sidebar-header img {
            width: 54px !important;
            height: 54px !important;
            object-fit: contain;
        }
        .nav-item { color: rgba(255, 255, 255, 0.9); }
        .nav-item:hover, .nav-item.active { background: #426c22; color: white; }
        .nav-item:hover:not(.active) { background: #4f7f29; }
        .logout-btn { background: rgba(255, 255, 255, 0.14); color: white; }
        .logout-btn:hover,
        .logout-btn:focus-visible { background: #b91c1c; }
        .sidebar-footer { border-top-color: rgba(255, 255, 255, 0.18); }

        /* MAIN CONTENT AREA */
        main {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 2rem;
        }

        /* HEADER & USER PROFILE */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--white);
            padding: 6px 16px 6px 6px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            background: var(--brand-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* DASHBOARD CARDS */
        .card {
            background: var(--white);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        .value-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px;
        }

        .page-title {
            color: var(--brand-dark); font-weight: 800; font-size: 1.75rem;
        }

        .page-subtitle {
            color: var(--text-muted); font-size: 0.9rem;
        }

        h3 { color: var(--brand-dark); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }

        /* FORM STYLING */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-main); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; padding: 20px; border: 2px dashed #e2e8f0; border-radius: 12px; }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .category-item {
            background: white; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0;
            margin-bottom: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        .category-item.active { 
            border-color: #5f9632; background: #f0fdf4; 
            box-shadow: 0 4px 12px rgba(95, 150, 50, 0.15);
            transform: translateX(4px);
        }

        /* Section transitions */
        #service-types-section, #appointment-types-section {
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            transform: translateY(0);
        }
        #service-types-section[style*="display: none"], #appointment-types-section[style*="display: none"] {
            opacity: 0;
            transform: translateY(-10px);
        }

        .value-card {
            animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .toggle-group { display: flex; flex-direction: column; gap: 12px; }
        .toggle-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border-radius: 8px; }

        .btn-delete {
            color: #dc2626; border: none; background: none; cursor: pointer; position: relative;
            width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .btn-delete:hover { background: #fee2e2; }
        .btn-delete[data-tooltip]::after {
            content: attr(data-tooltip); position: absolute; bottom: calc(100% + 6px); right: 0;
            background: #0f172a; color: #fff; font-size: 0.75rem; font-weight: 600; line-height: 1;
            padding: 6px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none;
            transform: translateY(3px); transition: opacity 0.15s ease, transform 0.15s ease; z-index: 60;
        }
        .btn-delete[data-tooltip]:hover::after, .btn-delete[data-tooltip]:focus-visible::after { opacity: 1; transform: translateY(0); }
        .btn-save {
            background: var(--brand-green);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-save:hover { opacity: 0.9; }

        .config-container { display: flex; gap: 2rem; }
        .config-sidebar { width: 300px; }
        .config-main { flex: 1; }

        /* Confirmation Modal Styles (from sysad-dashboard) */
        .modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(15, 23, 42, 0.5);
          display: none;
          align-items: center;
          justify-content: center;
          z-index: 1200;
          padding: 1rem;
          opacity: 0;
          transition: opacity 0.22s ease;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .confirm-modal {
          width: 100%;
          max-width: 430px;
          background: #fff;
          border: 1px solid #e2e8f0;
          border-radius: 14px;
          padding: 1.25rem;
          box-shadow: 0 18px 34px rgba(2, 6, 23, 0.25);
          transform: translateY(8px) scale(0.98);
          opacity: 0;
          transition: transform 0.22s ease, opacity 0.22s ease;
        }
        .modal-overlay.show .confirm-modal { transform: translateY(0) scale(1); opacity: 1; }
        .confirm-actions {
          display: flex;
          justify-content: flex-end;
          gap: 0.65rem;
          margin-top: 1.2rem;
        }
        .btn-cancel {
          background: #f1f5f9;
          border: none;
          border-radius: 8px;
          padding: 0.6rem 0.95rem;
          font-weight: 600;
          color: #334155;
          cursor: pointer;
        }
        .btn-confirm {
          background: var(--brand-green);
          border: none;
          border-radius: 8px;
          padding: 0.6rem 0.95rem;
          font-weight: 600;
          color: #fff;
          cursor: pointer;
        }
        .btn-confirm.danger { background: #dc2626; }
    </style>
    <script src="../shared/text-format.js"></script>
</head>
<body>

    <script src="../shared/sidebar.js" data-portal="system-admin"></script>
    <script src="../shared/user-badge.js"></script>

    <main>
        <div class="top-bar">
            <div>
                <h1 class="page-title">System Configuration and Maintenance</h1>
                <p class="page-subtitle">Manage the system environment and maintenance mode.</p>
            </div>
            <user-badge></user-badge>
        </div>

        <div class="card">
            <h3>General Settings</h3>   
            <div class="form-grid">
                <div class="form-group">
                    <label>Barangay Name</label>
                    <input type="text" value="Barangay Burgos Web Portal Services" disabled>
                    <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.35rem;">Fixed for this pilot (Barangay Burgos only).</p>
                </div>
                <div class="form-group">
                    <label for="systemEnvironmentSelect">System Environment</label>
                    <select id="systemEnvironmentSelect" aria-describedby="environmentConfirmHint">
                        <option value="" disabled selected>Select environment...</option>
                        <option value="production">Production</option>
                        <option value="maintenance">Maintenance Mode</option>
                    </select>
                    <p id="environmentConfirmHint" style="font-size:0.75rem;color:var(--text-muted);margin-top:0.35rem;">Changes require confirmation.</p>
                    <p id="sysConfigMessage" role="status" aria-live="polite" style="margin:0.35rem 0 0;font-size:0.9rem;"></p>
                </div>
            </div>
        </div>

    </main>

    <div id="logoutModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="logoutModalTitle" aria-hidden="true">
        <div class="confirm-modal">
            <h3 id="logoutModalTitle" style="font-size:1.05rem;color:var(--brand-dark);margin-bottom:0.55rem;">Confirm Logout</h3>
            <p style="font-size:0.9rem;color:var(--text-muted);line-height:1.5;margin:0;">Are you sure you want to logout from the System Admin Portal?</p>
            <div class="confirm-actions">
                <button type="button" class="btn-cancel" id="logoutCancelBtn">Cancel</button>
                <button type="button" class="btn-confirm danger" id="logoutConfirmBtn">Logout</button>
            </div>
        </div>
    </div>

    <div id="environmentConfirmModal" class="modal-overlay environment-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="environmentConfirmTitle" aria-hidden="true">
        <div class="confirm-modal">
            <h3 id="environmentConfirmTitle" style="font-size:1.05rem;color:var(--brand-dark);margin-bottom:0.55rem;">Confirm system environment</h3>
            <p id="environmentConfirmMessage" style="font-size:0.9rem;color:var(--text-muted);line-height:1.5;margin:0;"></p>
            <div class="confirm-actions">
                <button type="button" class="btn-cancel" id="environmentConfirmCancel">Cancel</button>
                <button type="button" class="btn-confirm" id="environmentConfirmOk">Confirm</button>
            </div>
        </div>
    </div>

    <script src="../shared/routes.js"></script>
    <script src="../shared/maintenance-check.js"></script>
    <script src="../shared/admin-access.js"></script>
    <script>
        const API_BASE_URL = (typeof window.API_BASE_URL === "string" && window.API_BASE_URL.trim()) || "";
        const COMMON_ROUTES = window.APP_ROUTES?.common || { landing: "../index.html" };
        const logoutModal = document.getElementById("logoutModal");
        const logoutCancelBtn = document.getElementById("logoutCancelBtn");
        const logoutConfirmBtn = document.getElementById("logoutConfirmBtn");

        function handleLogout(event) {
            event?.preventDefault?.();
            logoutModal?.classList.add("show");
            if (logoutModal) logoutModal.setAttribute("aria-hidden", "false");
        }
        function closeLogoutModal() {
            logoutModal?.classList.remove("show");
            if (logoutModal) logoutModal.setAttribute("aria-hidden", "true");
        }
        logoutCancelBtn?.addEventListener("click", closeLogoutModal);
        logoutModal?.addEventListener("click", (event) => {
            if (event.target === logoutModal) closeLogoutModal();
        });
        logoutConfirmBtn?.addEventListener("click", () => {
            closeLogoutModal();
            if (window.APP_NAV?.logout) {
                window.APP_NAV.logout();
                return;
            }
            sessionStorage.removeItem("adminAuth");
            window.location.href = COMMON_ROUTES.landing;
        });

        function getAdminAccessToken() {
            try {
                const raw = sessionStorage.getItem("adminAuth");
                if (!raw) return null;
                return JSON.parse(raw)?.session?.accessToken || null;
            } catch (_e) {
                return null;
            }
        }

        async function adminFetch(path, options = {}) {
            const token = getAdminAccessToken();
            const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
            if (token) headers.Authorization = `Bearer ${token}`;
            return fetch(`${API_BASE_URL}${path}`, { ...options, headers });
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function showConfigMessage(text, isError) {
            const el = document.getElementById("sysConfigMessage");
            if (!el) return;
            el.style.color = isError ? "#b91c1c" : "#15803d";
            el.textContent = text || "";
            if (text) setTimeout(() => { el.textContent = ""; }, 6000);
        }

        // Config management functionality
        document.addEventListener("DOMContentLoaded", async function () {
            const auth = await window.SB_ADMIN_ACCESS?.requireRole?.("system-admin");
            if (!auth) return;


            const environmentSelect = document.getElementById("systemEnvironmentSelect");
            const environmentConfirmModal = document.getElementById("environmentConfirmModal");
            const environmentConfirmMessage = document.getElementById("environmentConfirmMessage");
            const environmentConfirmCancel = document.getElementById("environmentConfirmCancel");
            const environmentConfirmOk = document.getElementById("environmentConfirmOk");
            let committedEnvironmentValue = "";
            let pendingEnvironmentValue = "";
            let pendingEnvironmentLabel = "";

            try {
                const envRes = await adminFetch("/system-admin/system-environment");
                const envJson = await envRes.json().catch(() => ({}));
                const v = String(envJson?.environment || "").toLowerCase();
                if (envRes.ok && envJson?.ok && environmentSelect && (v === "production" || v === "maintenance")) {
                    committedEnvironmentValue = v;
                    environmentSelect.value = committedEnvironmentValue;
                } else if (environmentSelect) {
                    committedEnvironmentValue = "production";
                    environmentSelect.value = "production";
                }
            } catch (_e) {
                if (environmentSelect) {
                    committedEnvironmentValue = "production";
                    environmentSelect.value = "production";
                }
            }

            function closeEnvironmentConfirmModal() {
                environmentConfirmModal?.classList.remove("show");
                environmentConfirmModal?.setAttribute("aria-hidden", "true");
                pendingEnvironmentValue = "";
                pendingEnvironmentLabel = "";
                environmentSelect?.focus();
            }

            function openEnvironmentConfirmModal() {
                if (!environmentConfirmModal || !environmentConfirmMessage) return;
                const isMaintenance = pendingEnvironmentValue === "maintenance";
                const extra = isMaintenance
                    ? " While in Maintenance mode, residents and the Barangay Secretary are blocked from the portal and only system administrators can sign in, until you switch back to Production."
                    : " Production is the standard live operating mode.";
                environmentConfirmMessage.textContent =
                    `Apply "${pendingEnvironmentLabel}" as the system environment? ${extra}`;
                environmentConfirmModal.classList.add("show");
                environmentConfirmModal.setAttribute("aria-hidden", "false");
                environmentConfirmOk?.focus();
            }

            async function applyEnvironmentSelection() {
                if (!environmentSelect || !pendingEnvironmentValue) {
                    closeEnvironmentConfirmModal();
                    return;
                }
                const target = pendingEnvironmentValue;
                const label = pendingEnvironmentLabel;
                if (environmentConfirmOk) environmentConfirmOk.disabled = true;
                try {
                    const res = await adminFetch("/system-admin/system-environment", {
                        method: "PUT",
                        body: JSON.stringify({ environment: target })
                    });
                    const json = await res.json().catch(() => ({}));
                    if (!res.ok || !json?.ok) {
                        const errText = json?.message || "Could not update environment on the server.";
                        const detail = json?.detail ? ` ${String(json.detail)}` : "";
                        showConfigMessage(`${errText}${detail}`.trim(), true);
                        closeEnvironmentConfirmModal();
                        return;
                    }
                    committedEnvironmentValue = json.environment || target;
                    environmentSelect.value = committedEnvironmentValue;
                    showConfigMessage(
                        committedEnvironmentValue === "maintenance"
                            ? "Maintenance mode is active. Residents and the Barangay Secretary are locked out; only system administrators can use the portal until you switch back to Production."
                            : `System environment set to ${label}. Full portal access is restored.`
                    );
                    closeEnvironmentConfirmModal();
                } finally {
                    if (environmentConfirmOk) environmentConfirmOk.disabled = false;
                }
            }

            function revertEnvironmentSelect() {
                if (!environmentSelect) return;
                environmentSelect.value = committedEnvironmentValue;
            }

            environmentSelect?.addEventListener("change", () => {
                const value = environmentSelect.value;
                const opt = environmentSelect.selectedOptions[0];
                const label = opt ? opt.textContent.trim() : value;
                if (!value) return;
                pendingEnvironmentValue = value;
                pendingEnvironmentLabel = label;
                revertEnvironmentSelect();
                openEnvironmentConfirmModal();
            });

            environmentConfirmCancel?.addEventListener("click", () => {
                closeEnvironmentConfirmModal();
            });
            environmentConfirmOk?.addEventListener("click", () => {
                void applyEnvironmentSelection();
            });
            environmentConfirmModal?.addEventListener("click", (ev) => {
                if (ev.target === environmentConfirmModal) closeEnvironmentConfirmModal();
            });

            // Escape key support
            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;
                if (logoutModal?.classList.contains("show")) {
                    closeLogoutModal();
                    return;
                }
                if (environmentConfirmModal?.classList.contains("show")) {
                    closeEnvironmentConfirmModal();
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password | SerbisyoBurgos</title>
    <link rel="icon" type="image/png" href="../asset/SB.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-green: #16a34a;
            --brand-dark: #043d2e;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #b91c1c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 2rem 1.75rem;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }
        .brand { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.25rem; font-weight: 700; color: var(--brand-dark); }
        .brand img { width: 36px; height: 36px; object-fit: contain; }
        h1 { font-size: 1.4rem; color: var(--brand-dark); margin-bottom: .5rem; }
        .lead { font-size: .9rem; color: var(--text-muted); line-height: 1.55; margin-bottom: 1.4rem; }
        .field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
        label { font-size: .8rem; font-weight: 600; color: var(--text-main); }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: .75rem .9rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font: inherit;
            font-size: .95rem;
            color: var(--text-main);
            background: #fff;
        }
        input:focus { outline: 2px solid rgba(22, 163, 74, .35); border-color: var(--brand-green); }
        .hint { font-size: .75rem; color: var(--text-muted); min-height: 1.1em; }
        .hint.bad { color: var(--danger); }
        .hint.good { color: var(--brand-green); }
        .show { display: flex; align-items: center; gap: .5rem; font-size: .85rem; color: var(--text-muted); margin: .25rem 0 1.25rem; cursor: pointer; }
        .show input { width: 1rem; height: 1rem; accent-color: var(--brand-green); }
        .btn {
            width: 100%;
            padding: .85rem 1rem;
            border: none;
            border-radius: 10px;
            background: var(--brand-green);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .msg { font-size: .85rem; margin-top: 1rem; min-height: 1.2em; line-height: 1.4; }
        .msg.error { color: var(--danger); }
        .msg.ok { color: var(--brand-green); font-weight: 600; }
        .foot { margin-top: 1.25rem; text-align: center; font-size: .85rem; }
        .foot button { background: none; border: none; color: var(--text-muted); font: inherit; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand"><img src="../asset/SB.png" alt=""><span>SerbisyoBurgos</span></div>
        <h1>Set your own password</h1>
        <p class="lead">For your security, the barangay office gave you a temporary password. Enter it below, then choose a new password that only you know. You will need this new password the next time you log in.</p>

        <form id="pwForm" novalidate>
            <div class="field">
                <label for="currentPw">Temporary password <span style="font-weight:400;color:var(--text-muted)">(the one you were given)</span></label>
                <input id="currentPw" type="password" autocomplete="current-password" maxlength="128" required>
            </div>
            <div class="field">
                <label for="newPw">New password</label>
                <input id="newPw" type="password" autocomplete="new-password" maxlength="128" required>
                <div class="hint" id="newHint">At least 8 characters, and different from the temporary password.</div>
            </div>
            <div class="field">
                <label for="confirmPw">Confirm new password</label>
                <input id="confirmPw" type="password" autocomplete="new-password" maxlength="128" required>
                <div class="hint" id="confirmHint"></div>
            </div>
            <label class="show"><input type="checkbox" id="showPw"> Show passwords</label>
            <button class="btn" id="saveBtn" type="submit">Save and continue</button>
            <p class="msg" id="msg" role="status" aria-live="polite"></p>
        </form>

        <div class="foot"><button type="button" id="logoutBtn">Log out</button></div>
    </main>

    <script src="../shared/routes.js"></script>
    <script src="../shared/resident-auth-guard.js"></script>
    <script>
        (function () {
            const $ = (id) => document.getElementById(id);
            const API_BASE_URL = (typeof window.API_BASE_URL === "string" && window.API_BASE_URL.trim()) || "https://serbisyoburgos-ver-26.onrender.com";
            const dashboardHref = () => window.APP_ROUTES?.resident?.dashboard || "dashboard.html";

            // Someone who does not need to change their password has nothing to do here.
            try {
                const saved = JSON.parse(sessionStorage.getItem("residentAuth") || "null");
                if (saved && saved.user && saved.user.mustChangePassword !== true) window.location.replace(dashboardHref());
            } catch (_e) { /* the guard sends people without a session to the login page */ }

            function setMsg(text, kind) {
                const el = $("msg");
                el.textContent = text || "";
                el.className = "msg" + (kind ? " " + kind : "");
            }

            function checkLive() {
                const cur = $("currentPw").value, next = $("newPw").value, conf = $("confirmPw").value;
                const nh = $("newHint"), ch = $("confirmHint");
                if (next && next.length < 8) { nh.textContent = "Too short: use at least 8 characters."; nh.className = "hint bad"; }
                else if (next && cur && next === cur) { nh.textContent = "Choose a password different from the temporary one."; nh.className = "hint bad"; }
                else if (next) { nh.textContent = "Looks good."; nh.className = "hint good"; }
                else { nh.textContent = "At least 8 characters, and different from the temporary password."; nh.className = "hint"; }
                if (conf && conf !== next) { ch.textContent = "Passwords do not match yet."; ch.className = "hint bad"; }
                else if (conf) { ch.textContent = "Passwords match."; ch.className = "hint good"; }
                else { ch.textContent = ""; ch.className = "hint"; }
            }
            ["currentPw", "newPw", "confirmPw"].forEach((id) => $(id).addEventListener("input", checkLive));

            $("showPw").addEventListener("change", (e) => {
                ["currentPw", "newPw", "confirmPw"].forEach((id) => { $(id).type = e.target.checked ? "text" : "password"; });
            });

            $("logoutBtn").addEventListener("click", () => {
                if (window.APP_NAV && typeof window.APP_NAV.logout === "function") window.APP_NAV.logout();
                else { sessionStorage.removeItem("residentAuth"); window.location.href = window.APP_ROUTES?.resident?.login || "../login.html"; }
            });

            $("pwForm").addEventListener("submit", async (event) => {
                event.preventDefault();
                const currentPassword = $("currentPw").value;
                const newPassword = $("newPw").value;
                const confirmPassword = $("confirmPw").value;
                setMsg("");
                if (!currentPassword) return setMsg("Enter the temporary password you were given.", "error");
                if (newPassword.length < 8) return setMsg("Your new password must be at least 8 characters.", "error");
                if (newPassword === currentPassword) return setMsg("Your new password must be different from the temporary one.", "error");
                if (newPassword !== confirmPassword) return setMsg("The new password and its confirmation do not match.", "error");

                const btn = $("saveBtn");
                btn.disabled = true; btn.textContent = "Saving…";
                try {
                    // Plain fetch (not residentApiFetch): a wrong temporary password answers 401, which the shared
                    // helper would treat as an expired session and log the resident out.
                    const res = await fetch(`${API_BASE_URL}/resident/change-password`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", ...(window.residentApiHeaders ? window.residentApiHeaders() : {}) },
                        body: JSON.stringify({ currentPassword, newPassword, confirmPassword })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data?.ok) {
                        setMsg(data?.message || "Could not update your password. Please try again.", "error");
                        if (res.status === 401 && /expired|invalid.*token|session/i.test(String(data?.message || ""))) {
                            window.location.href = window.APP_ROUTES?.resident?.login || "../login.html";
                        }
                        return;
                    }
                    if (typeof window.residentClearPasswordChangeRequired === "function") window.residentClearPasswordChangeRequired();
                    setMsg("Password updated. Taking you to your dashboard…", "ok");
                    $("pwForm").querySelectorAll("input").forEach((i) => { i.disabled = true; });
                    setTimeout(() => { window.location.href = dashboardHref(); }, 900);
                } catch (_e) {
                    setMsg("Cannot reach the server. Check your connection and try again.", "error");
                } finally {
                    if (!$("currentPw").disabled) { btn.disabled = false; btn.textContent = "Save and continue"; }
                }
            });
        })();
    </script>
</body>
</html>
